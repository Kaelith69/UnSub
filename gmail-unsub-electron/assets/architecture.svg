<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 440" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#555"/>
    </marker>
    <marker id="arrow-blue" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#1a54d6"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="860" height="440" rx="12" fill="#f7f7f5"/>

  <!-- Title -->
  <text x="430" y="32" text-anchor="middle" font-size="15" font-weight="700" fill="#111110">UnSub — Runtime Architecture</text>

  <!-- ─── Renderer Process box ─── -->
  <rect x="30" y="60" width="220" height="200" rx="10" fill="#e8f0fd" stroke="#1a54d6" stroke-width="1.5"/>
  <text x="140" y="83" text-anchor="middle" font-size="12" font-weight="700" fill="#1a54d6">Renderer Process</text>
  <text x="140" y="100" text-anchor="middle" font-size="10" fill="#444">index.html + app.js</text>
  <!-- Sub-boxes -->
  <rect x="48" y="110" width="184" height="34" rx="5" fill="#fff" stroke="#bcd0f7" stroke-width="1"/>
  <text x="140" y="125" text-anchor="middle" font-size="10" font-weight="600" fill="#333">AppState</text>
  <text x="140" y="138" text-anchor="middle" font-size="9" fill="#777">senders · selected · filter · sort</text>
  <rect x="48" y="152" width="184" height="34" rx="5" fill="#fff" stroke="#bcd0f7" stroke-width="1"/>
  <text x="140" y="167" text-anchor="middle" font-size="10" font-weight="600" fill="#333">UIController</text>
  <text x="140" y="180" text-anchor="middle" font-size="9" fill="#777">screens · toast · renderSenderList</text>
  <rect x="48" y="194" width="184" height="34" rx="5" fill="#fff" stroke="#bcd0f7" stroke-width="1"/>
  <text x="140" y="209" text-anchor="middle" font-size="10" font-weight="600" fill="#333">AppController</text>
  <text x="140" y="222" text-anchor="middle" font-size="9" fill="#777">boot · doLogin · startScan · execute</text>

  <!-- ─── Preload bridge box ─── -->
  <rect x="310" y="100" width="180" height="120" rx="10" fill="#fef3df" stroke="#8a5500" stroke-width="1.5"/>
  <text x="400" y="123" text-anchor="middle" font-size="12" font-weight="700" fill="#8a5500">Preload Bridge</text>
  <text x="400" y="140" text-anchor="middle" font-size="10" fill="#555">preload.js</text>
  <text x="400" y="158" text-anchor="middle" font-size="9" fill="#666">contextBridge.exposeInMainWorld</text>
  <text x="400" y="172" text-anchor="middle" font-size="9" fill="#888">api.authStatus / authLogin</text>
  <text x="400" y="185" text-anchor="middle" font-size="9" fill="#888">api.authLogout / scanStart</text>
  <text x="400" y="198" text-anchor="middle" font-size="9" fill="#888">api.onProgress / unsubOne</text>

  <!-- ─── Main Process box ─── -->
  <rect x="550" y="60" width="270" height="200" rx="10" fill="#e6f4ed" stroke="#1a7a4a" stroke-width="1.5"/>
  <text x="685" y="83" text-anchor="middle" font-size="12" font-weight="700" fill="#1a7a4a">Main Process</text>
  <text x="685" y="100" text-anchor="middle" font-size="10" fill="#444">main.js  ·  ipcMain.handle</text>
  <rect x="568" y="110" width="234" height="28" rx="5" fill="#fff" stroke="#b2dfc8" stroke-width="1"/>
  <text x="685" y="123" text-anchor="middle" font-size="9" fill="#333">auth:status  ·  auth:login  ·  auth:logout</text>
  <text x="685" y="133" text-anchor="middle" font-size="8" fill="#888">OAuth2 + token persistence (electron-store)</text>
  <rect x="568" y="146" width="234" height="28" rx="5" fill="#fff" stroke="#b2dfc8" stroke-width="1"/>
  <text x="685" y="159" text-anchor="middle" font-size="9" fill="#333">scan:start → scan:progress (event)</text>
  <text x="685" y="169" text-anchor="middle" font-size="8" fill="#888">paginated fetch · asyncPool · senderMap</text>
  <rect x="568" y="182" width="234" height="28" rx="5" fill="#fff" stroke="#b2dfc8" stroke-width="1"/>
  <text x="685" y="195" text-anchor="middle" font-size="9" fill="#333">unsub:one  (RFC 8058 · HTTP · mailto)</text>
  <text x="685" y="205" text-anchor="middle" font-size="8" fill="#888">getSafeHttpUrl · isBlockedHost · withRetry</text>
  <rect x="568" y="218" width="234" height="28" rx="5" fill="#fff" stroke="#b2dfc8" stroke-width="1"/>
  <text x="685" y="231" text-anchor="middle" font-size="9" fill="#333">cleanupSenderEmails (optional trash)</text>
  <text x="685" y="241" text-anchor="middle" font-size="8" fill="#888">messages.trash  ·  batched 10 at a time</text>

  <!-- ─── Gmail API box ─── -->
  <rect x="570" y="310" width="230" height="70" rx="10" fill="#fceaea" stroke="#b52828" stroke-width="1.5"/>
  <text x="685" y="332" text-anchor="middle" font-size="12" font-weight="700" fill="#b52828">Gmail API v1</text>
  <text x="685" y="349" text-anchor="middle" font-size="9" fill="#555">googleapis  ·  google.gmail({ version:'v1' })</text>
  <text x="685" y="362" text-anchor="middle" font-size="9" fill="#888">users.messages.list / get / send / trash</text>
  <text x="685" y="375" text-anchor="middle" font-size="9" fill="#888">users.getProfile</text>

  <!-- ─── OAuth local server box ─── -->
  <rect x="30" y="310" width="220" height="70" rx="10" fill="#fff" stroke="#aaa" stroke-width="1.5"/>
  <text x="140" y="332" text-anchor="middle" font-size="12" font-weight="700" fill="#555">OAuth Callback Server</text>
  <text x="140" y="349" text-anchor="middle" font-size="9" fill="#666">http.createServer  ·  localhost:9876</text>
  <text x="140" y="362" text-anchor="middle" font-size="9" fill="#888">PKCE-like state check  ·  code exchange</text>
  <text x="140" y="375" text-anchor="middle" font-size="9" fill="#888">5-minute timeout  ·  auto-close</text>

  <!-- ─── electron-store box ─── -->
  <rect x="310" y="310" width="180" height="70" rx="10" fill="#f0f0ee" stroke="#999" stroke-width="1.5"/>
  <text x="400" y="332" text-anchor="middle" font-size="12" font-weight="700" fill="#555">electron-store</text>
  <text x="400" y="349" text-anchor="middle" font-size="9" fill="#666">name: 'auth'  ·  device-scoped AES key</text>
  <text x="400" y="362" text-anchor="middle" font-size="9" fill="#888">tokens.access_token  ·  tokens.refresh_token</text>
  <text x="400" y="375" text-anchor="middle" font-size="9" fill="#888">never transmitted off-device</text>

  <!-- ─── Arrows ─── -->
  <!-- Renderer → Preload (IPC invoke) -->
  <line x1="250" y1="160" x2="308" y2="160" stroke="#1a54d6" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
  <text x="280" y="153" text-anchor="middle" font-size="8" fill="#1a54d6">invoke</text>

  <!-- Preload → Main (IPC) -->
  <line x1="490" y1="160" x2="548" y2="160" stroke="#1a54d6" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
  <text x="520" y="153" text-anchor="middle" font-size="8" fill="#1a54d6">IPC</text>

  <!-- Main → Preload (scan:progress event) -->
  <line x1="548" y1="175" x2="490" y2="175" stroke="#555" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
  <text x="520" y="187" text-anchor="middle" font-size="8" fill="#555">events</text>

  <!-- Main → Gmail API -->
  <line x1="685" y1="260" x2="685" y2="308" stroke="#b52828" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="700" y="290" font-size="8" fill="#b52828">HTTP/2</text>

  <!-- Main → OAuth server -->
  <line x1="570" y1="260" x2="240" y2="310" stroke="#555" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
  <text x="390" y="295" text-anchor="middle" font-size="8" fill="#555">spawns</text>

  <!-- Main → electron-store -->
  <line x1="570" y1="250" x2="490" y2="320" stroke="#555" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
  <text x="520" y="295" text-anchor="middle" font-size="8" fill="#888">tokens r/w</text>

  <!-- OAuth server → electron-store (tokens written after code exchange) -->
  <line x1="250" y1="345" x2="308" y2="345" stroke="#555" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="280" y="339" text-anchor="middle" font-size="8" fill="#888">store tokens</text>
</svg>
